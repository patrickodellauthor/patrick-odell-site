site:
  name: Patrick O'Dell
  site: 'https://www.patrickodellauthor.com'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: Patrick O'Dell
    template: "%s — Patrick O'Dell"
  description: "Patrick O'Dell writes urban and dark fantasy. His debut novel, Gods and Monsters, launches February 2027 — the first book in The Godfire Saga."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Patrick O'Dell
    images:
      - url: '/gods-and-monsters-cover.jpg'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@podellauthor'
    site: '@podellauthor'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: true
    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: G-GDD66SSYVB

ui:
  theme: 'system'
